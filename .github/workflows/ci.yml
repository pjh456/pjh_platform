name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            ccache_variant: ccache
            cmake_args: ""
          - name: Linux (Clang)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
            cmake_args: ""
          - name: Linux (Clang, ASan+UBSan)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
            cmake_args: "-DCMAKE_BUILD_TYPE=Debug -DPJH_PLATFORM_SANITIZERS=ON"
          - name: macOS
            os: macos-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
            cmake_args: ""
          - name: Windows (MSVC)
            os: windows-latest
            cc: cl
            cxx: cl
            ccache_variant: ccache
            cmake_args: ""
          - name: Linux (GCC, CMake 3.20)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            ccache_variant: ccache
            cmake_version: "3.20.6"
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.ccache_variant }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = vswhere -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object { Add-Content $env:GITHUB_ENV $_ }

      - name: Setup CMake ${{ matrix.cmake_version }}
        if: matrix.cmake_version != ''
        shell: bash
        run: |
          version="${{ matrix.cmake_version }}"
          arch="$(uname -m)"
          url="https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-${arch}.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/cmake.tar.gz" "$url"
          tar --extract --gzip --file "$RUNNER_TEMP/cmake.tar.gz" \
            --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-${version}-linux-${arch}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmake-${version}-linux-${arch}/bin/cmake" --version

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
        run: cmake -B build -G Ninja -DPJH_PLATFORM_BUILD_EXAMPLES=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error --repeat until-fail:3
