name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux (Clang)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: Windows (MSVC)
            os: windows-latest
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = vswhere -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object { Add-Content $env:GITHUB_ENV $_ }

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
